name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.9", "3.10", "3.11" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -e .

      - name: Run Brian2 sanity check
        run: |
          python organoid_rl/tests/sanity_check.py

      - name: Run quick simulation test
        run: |
          python organoid_rl/tests/quick_test.py

      - name: Run unit test suite
        run: |
          python -m unittest discover -s organoid_rl/tests -p "test_*.py" -v

      - name: Test quickstart example
        run: |
          python examples/01_quickstart.py
