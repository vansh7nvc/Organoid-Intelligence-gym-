[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "organoid_rl"
version = "1.0.0"
description = "OrganoidEnv: A Stabilized Reinforcement Learning Environment for Biological Spiking Networks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Vansh Sharma", email = "sharmavansh1409@gmail.com" },
    { name = "Dr. Seema Malik" }
]
keywords = [
    "neuromorphic-computing",
    "spiking-neural-networks",
    "reinforcement-learning",
    "brian2",
    "gymnasium",
    "computational-neuroscience",
    "organoid-intelligence"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "brian2>=2.8.0",
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "torch>=2.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]
baselines = [
    "stable-baselines3>=2.0.0",
    "ray[tune]>=2.9.0",
]

[project.urls]
Homepage = "https://github.com/vansh7nvc/Organoid-Intelligence-gym-"
Documentation = "https://github.com/vansh7nvc/Organoid-Intelligence-gym-#readme"
Repository = "https://github.com/vansh7nvc/Organoid-Intelligence-gym-"
"Bug Tracker" = "https://github.com/vansh7nvc/Organoid-Intelligence-gym-/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["organoid_rl*"]

[tool.pytest.ini_options]
testpaths = ["organoid_rl/tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 100
target-version = "py39"
